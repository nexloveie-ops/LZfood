name: LZFoodWidget
options:
  bundleIdPrefix: com.nexloveie
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  LZFoodWidget:
    type: application
    platform: iOS
    sources:
      - path: LZFoodWidget
      - path: Shared
        excludes:
          - WidgetLocalDefaults.example.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nexloveie.lzfood.widget
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: LZFood Widget
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
      INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
      INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: LZFoodWidget/LZFoodWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nexloveie.lzfood.widget
    dependencies:
      - target: LZFoodWidgetExtension
        embed: true

  LZFoodWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LZFoodWidgetExtension
        excludes:
          - Info.plist
      - path: Shared
        excludes:
          - WidgetLocalDefaults.example.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nexloveie.lzfood.widget.extension
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: LZFoodWidgetExtension/Info.plist
    entitlements:
      path: LZFoodWidgetExtension/LZFoodWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nexloveie.lzfood.widget

schemes:
  LZFoodWidget:
    build:
      targets:
        LZFoodWidget: all
