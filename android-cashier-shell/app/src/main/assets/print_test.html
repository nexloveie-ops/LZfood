<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LZFOOD 打印机测试</title>
  <style>
    body { font-family: sans-serif; padding: 16px; font-size: 16px; }
    button { font-size: 18px; padding: 12px 20px; margin: 8px 0; width: 100%; }
    h2 { color: #c62828; }
  </style>
</head>
<body>
  <h2>热敏打印机测试</h2>
  <p>不依赖 React。若此页能打印，说明机身打印机与 App 桥接正常。</p>
  <p>桥接版本：<b id="ver">检测中…</b></p>
  <p id="verWarn" style="color:#c62828;display:none">仍是旧版 stub，请卸载后重装 <b>0.3.x</b> APK（见 README）。</p>
  <p>收银主站仍须 <b>更新 System WebView</b> 后才能显示完整界面。</p>
  <button type="button" onclick="testPrint()">测试打印</button>
  <button type="button" onclick="openCashier()">打开完整收银 (WebView)</button>
  <pre id="log"></pre>
  <script>
    function log(msg) {
      document.getElementById('log').textContent += msg + '\n';
    }
    (function showBridgeVersion() {
      var el = document.getElementById('ver');
      var warn = document.getElementById('verWarn');
      if (!window.LZFOODPrinter || !window.LZFOODPrinter.getVersion) {
        el.textContent = '未找到 LZFOODPrinter';
        return;
      }
      try {
        var v = window.LZFOODPrinter.getVersion();
        el.textContent = v;
        if (v && v.indexOf('stub') >= 0) warn.style.display = 'block';
        if (v && v.indexOf('0.3') >= 0) log('OK: 已加载串口打印版 ' + v);
      } catch (e) {
        el.textContent = 'getVersion 失败: ' + e;
      }
    })();
    function testPrint() {
      if (!window.LZFOODPrinter || !window.LZFOODPrinter.printText) {
        log('错误: 未找到 LZFOODPrinter（请用 LZFOOD 收银 App 打开，不要用 Firefox）');
        return;
      }
      var fw = '\u3000';
      var text = '@N@' + fw.repeat(8) + 'Taste Of Asia\n@N@' + fw.repeat(2) + 'UNIT 96B OMNI PARK SHOPPING CENTRE\n@N@' + fw.repeat(10) + 'Tel: 01-7123122\n@N@1X \u8fa3\u888b\n@N@' + fw.repeat(16) + '9.50 EUR\n@T@Total                              9.50 EUR\n';
      window.LZFOODPrinter.printText(text, 1);
      log('已调用 printText');
    }
    function openCashier() {
      var url = (window.LZFOODPrinter && window.LZFOODPrinter.getCashierUrl)
        ? window.LZFOODPrinter.getCashierUrl()
        : 'https://food.lztechserve.com/demo/cashier';
      location.href = url;
    }
  </script>
</body>
</html>
