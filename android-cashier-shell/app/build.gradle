plugins {
    id 'com.android.application'
}

def readCashierStartUrl = {
    def propsFile = rootProject.file('cashier.properties')
    def fallback = 'https://food.lztechserve.com/'
    if (!propsFile.exists()) {
        return fallback
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    def url = props.getProperty('cashier.url', fallback)?.trim()
    return (url != null && !url.isEmpty()) ? url : fallback
}

android {
    namespace 'ie.lzfood.cashier'
    compileSdk 35

    defaultConfig {
        applicationId 'ie.lzfood.cashier'
        versionCode 14
        versionName '0.3.9'
        resValue 'string', 'cashier_start_url', readCashierStartUrl()
    }

    flavorDimensions += 'platform'
    productFlavors {
        h10 {
            dimension 'platform'
            minSdk 22
            targetSdk 22
            versionNameSuffix '-h10'
        }
        android15 {
            dimension 'platform'
            minSdk 24
            targetSdk 35
            applicationIdSuffix '.a15'
            versionNameSuffix '-android15'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
