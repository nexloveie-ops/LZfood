plugins {
    id 'com.android.application'
}

def readCashierStartUrl = {
    def propsFile = rootProject.file('cashier.properties')
    def fallback = 'https://food.lztechserve.com/'
    if (!propsFile.exists()) {
        return fallback
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    def url = props.getProperty('cashier.url', fallback)?.trim()
    return (url != null && !url.isEmpty()) ? url : fallback
}

android {
    namespace 'ie.lzfood.cashier'
    compileSdk 34

    defaultConfig {
        applicationId 'ie.lzfood.cashier'
        minSdk 22
        targetSdk 22
        versionCode 13
        versionName '0.3.9'
        resValue 'string', 'cashier_start_url', readCashierStartUrl()
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
